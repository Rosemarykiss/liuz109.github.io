<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Flower, A Day</title>

  <link rel="stylesheet" href="main.css">
</head>

<body>
  <main class="page">

    <div class="ground"></div>

    <section class="garden" aria-label="A red flower">

      <img class="stem" src="imgs/stem.png" alt="">
      <img class="leaf" src="imgs/leaf.png" alt="">

      <div class="flower">
        <img class="petal p1" src="imgs/1.png" alt="">
        <img class="petal p2" src="imgs/2.png" alt="">
        <img class="petal p3" src="imgs/3.png" alt="">
        <img class="petal p4" src="imgs/4.png" alt="">
        <img class="petal p5" src="imgs/5.png" alt="">
        <img class="petal p6" src="imgs/6.png" alt="">
        <img class="petal p7" src="imgs/7.png" alt="">
        <img class="petal p8" src="imgs/8.png" alt="">
        <img class="petal p9" src="imgs/9.png" alt="">
        <img class="petal p10" src="imgs/10.png" alt="">
      </div>

    </section>

    <section class="todo">
      <h1>To-Do List</h1>

      <div class="tasks">
        <label>
          <span>Cooking</span>
          <input type="checkbox">
        </label>

        <label>
          <span>Shopping</span>
          <input type="checkbox">
        </label>

        <label>
          <span>Homework</span>
          <input type="checkbox">
        </label>

        <label>
          <span>School</span>
          <input type="checkbox">
        </label>

        <label>
          <span>Vacation</span>
          <input type="checkbox">
        </label>
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
